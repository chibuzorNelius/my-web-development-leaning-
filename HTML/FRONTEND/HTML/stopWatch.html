<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/HTML/CSS/stopWatch.css"/>
    <title>Document</title>
</head>
<body>
    <!-- is's not really a stop but a counter that will count still is hits the limit of 50 -->


    <div class="container">
        <h1>Stop Watch</h1>
        <div class="counter">
            <span id="counterDisplay">0</span>
        </div>
        <div class="buttons">
            <button id="startBtn">Start</button>
            <button id="stopBtn">Stop</button>
            <button id="resetBtn">Reset</button>
        </div>
    </div>

    <script src="../../../javaScript/stopWatch.js"></script>
</body>
</html>
