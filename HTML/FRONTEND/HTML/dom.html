<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../CSS/dom.css">
    <title>Market Page</title>
</head>
<body>
    <div class="overlay" id="cartOverlay"></div>

    <aside class="cart-panel" id="cartPanel">
        <div class="cart-panel-head">
            <div>
                <p class="panel-label">Shopping bag</p>
                <h3>Your Cart</h3>
            </div>
            <button class="close-btn" id="closeCart" aria-label="close cart">×</button>
        </div>

        <div id="cartItems" class="cart-items"></div>

        <div class="cart-summary">
            <div class="summary-row">
                <span>Subtotal</span>
                <strong id="subTotal">$0.00</strong>
            </div>
            <div class="summary-row">
                <span>Delivery</span>
                <strong>Free</strong>
            </div>
            <div class="summary-row total">
                <span>Total</span>
                <strong id="totalPrice">$0.00</strong>
            </div>
            <p class="summary-note">Free delivery on orders above $50</p>
            <button class="main-btn full">Proceed to Checkout</button>
        </div>
    </aside>

    <header class="top">
        <div class="top-row">
            <div class="logo">Fresh Market</div>
            <nav class="nav">
                <a href="#">Home</a>
                <a href="#">Shop</a>
                <a href="#">About</a>
                <a href="#">Contact</a>
            </nav>
            <div id="cart" class="cart-icon" role="button" tabindex="0" aria-label="cart">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="9" cy="20" r="1"></circle>
                    <circle cx="18" cy="20" r="1"></circle>
                    <path d="M1 1h2l2.2 10.2a2 2 0 0 0 2 1.8h8.7a2 2 0 0 0 2-1.6L17 5H6"></path>
                </svg>
                <span id="cart-count">0</span>
            </div>
        </div>

        <div class="head-text">
            <h1>Fresh food for your home</h1>
            <p>Pick daily needs, snacks, and drinks in one easy place.</p>
            <button class="main-btn">Shop Now</button>
        </div>
    </header>

    <main class="main">
        <section class="product-area">
            <div class="title-row">
                <h2>Popular Products</h2>
                <span id="cartCount">0 items in cart</span>
            </div>

            <div id="product-grid" class="product-grid"></div>
        </section>
    </main>

    <script src="../../../javaScript/dom.js"></script>
</body>
</html>
